name: Tester

# Publiceringen sköts av Netlify sedan 2026-10 (netlify.toml) - repot är
# privat, och GitHub Pages kräver ett publikt repo på gratisplanen. Här körs
# bara typkontroll och tester, så att ett rött kryss syns i GitHub även om
# Netlify-bygget (som också kör testerna) inte tittas på.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
